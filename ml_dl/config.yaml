# RANDAL PINN — Schiesser/Randall Glucose Tolerance Model
# Schiesser (2014), Ch. 2 — ncase=2 (normal Bb, with glucose infusion)

model:
  type: PINN
  ode_system: Schiesser-Randall-2ODE
  hidden_layers: 6
  neurons_per_layer: 128
  activation: tanh
  outputs: [G_norm, I_norm]

training:
  epochs: 20000
  lr_initial: 0.0005
  scheduler: ReduceLROnPlateau
  scheduler_patience: 300
  scheduler_factor: 0.5
  lambda_physics_max: 0.1
  physics_ramp_start_epoch: 2000
  lambda_ic: 0.05
  spike_upweight: 16
  spike_region_hours: 2.0
  n_collocation_points: 500
  best_loss: 0.000074

parameters:  # Schiesser (2014) Ch.2, Listing 2.1 — ncase=2
  Ex: 15000.0
  Cg: 150.0
  Ci: 150.0
  Q: 8400.0
  Gt: 80000.0
  Dd: 24.7
  Gg: 13.9
  Gk: 250.0
  Mu: 72.0
  G0: 51.0
  Bb: 14.3
  Aa: 76.0

initial_conditions:
  G0_mGml: 81.14
  I0_mIml: 5.671

normalisation:
  t_max_h: 12.0000
  G_scale_mGml: 88.3935
  I_scale_mIml: 7.0390

metrics:
  RMSE_G_mGml: 0.5753
  RMSE_I_mIml: 0.039258
  MAE_G_mGml:  0.4531
  MAE_I_mIml:  0.031178
